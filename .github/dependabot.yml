version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      astro-tooling:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "typescript"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
