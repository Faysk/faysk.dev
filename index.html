<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faysk.dev | System Scanner</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#050505;
      color:#00ff88;
      font-family:Consolas, monospace;
      padding:20px;
    }

    h1{
      font-size:3rem;
      margin-bottom:10px;
      color:white;
    }

    h2{
      margin-top:30px;
      margin-bottom:10px;
      color:#00ffaa;
      border-bottom:1px solid #222;
      padding-bottom:5px;
    }

    .card{
      background:#0d0d0d;
      border:1px solid #1f1f1f;
      border-radius:10px;
      padding:15px;
      margin-bottom:15px;
      box-shadow:0 0 15px rgba(0,255,100,0.05);
    }

    .item{
      margin:6px 0;
      word-break:break-word;
    }

    .label{
      color:#888;
    }

    .value{
      color:#00ff88;
    }

    .loading{
      color:orange;
    }

    .error{
      color:red;
    }

    canvas{
      margin-top:10px;
      border:1px solid #222;
    }
  </style>
</head>
<body>

  <h1>🚀 faysk.dev</h1>
  <p>System & Browser Scanner</p>

  <div id="content"></div>

<script>

const content = document.getElementById("content");

function addSection(title){
  const section = document.createElement("div");
  section.innerHTML = `<h2>${title}</h2>`;
  content.appendChild(section);
  return section;
}

function addItem(section, label, value){
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `
    <div class="item">
      <span class="label">${label}: </span>
      <span class="value">${value}</span>
    </div>
  `;
  section.appendChild(div);
}

const browserSection = addSection("🌐 Browser Information");

addItem(browserSection, "User Agent", navigator.userAgent);
addItem(browserSection, "Platform", navigator.platform);
addItem(browserSection, "Language", navigator.language);
addItem(browserSection, "Languages", navigator.languages.join(", "));
addItem(browserSection, "Cookies Enabled", navigator.cookieEnabled);
addItem(browserSection, "Online", navigator.onLine);
addItem(browserSection, "Hardware Concurrency", navigator.hardwareConcurrency || "Unknown");
addItem(browserSection, "Device Memory", navigator.deviceMemory ? navigator.deviceMemory + " GB" : "Unknown");
addItem(browserSection, "Max Touch Points", navigator.maxTouchPoints);

const screenSection = addSection("🖥️ Screen Information");

addItem(screenSection, "Screen Resolution", `${screen.width} x ${screen.height}`);
addItem(screenSection, "Available Resolution", `${screen.availWidth} x ${screen.availHeight}`);
addItem(screenSection, "Color Depth", screen.colorDepth);
addItem(screenSection, "Pixel Ratio", window.devicePixelRatio);

const timeSection = addSection("🕒 Time Information");

addItem(timeSection, "Timezone", Intl.DateTimeFormat().resolvedOptions().timeZone);
addItem(timeSection, "Current Time", new Date().toString());

const networkSection = addSection("📡 Network");

if(navigator.connection){
  addItem(networkSection, "Connection Type", navigator.connection.effectiveType);
  addItem(networkSection, "Downlink", navigator.connection.downlink + " Mbps");
  addItem(networkSection, "RTT", navigator.connection.rtt + " ms");
  addItem(networkSection, "Save Data", navigator.connection.saveData);
}else{
  addItem(networkSection, "Connection API", "Not supported");
}

const gpuSection = addSection("🎮 GPU Information");

try{
  const canvas = document.createElement("canvas");
  const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");

  if(gl){
    const debugInfo = gl.getExtension("WEBGL_debug_renderer_info");

    if(debugInfo){
      addItem(gpuSection, "GPU Vendor", gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL));
      addItem(gpuSection, "GPU Renderer", gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL));
    }
  }else{
    addItem(gpuSection, "WebGL", "Not supported");
  }
}catch(e){
  addItem(gpuSection, "GPU Error", e.message);
}

const locationSection = addSection("📍 Geolocation");

addItem(locationSection, "Location Status", "Waiting permission...");

navigator.geolocation.getCurrentPosition(
  (position) => {
    locationSection.innerHTML = `<h2>📍 Geolocation</h2>`;

    addItem(locationSection, "Latitude", position.coords.latitude);
    addItem(locationSection, "Longitude", position.coords.longitude);
    addItem(locationSection, "Accuracy", position.coords.accuracy + " meters");
  },
  (error) => {
    locationSection.innerHTML = `<h2>📍 Geolocation</h2>`;
    addItem(locationSection, "Location Error", error.message);
  }
);

const batterySection = addSection("🔋 Battery");

if(navigator.getBattery){
  navigator.getBattery().then((battery) => {
    addItem(batterySection, "Charging", battery.charging);
    addItem(batterySection, "Battery Level", Math.round(battery.level * 100) + "%");
  });
}else{
  addItem(batterySection, "Battery API", "Not supported");
}

const ipSection = addSection("🌍 Public IP");

fetch("https://api.ipify.org?format=json")
.then(res => res.json())
.then(data => {
  addItem(ipSection, "IP Address", data.ip);
})
.catch(() => {
  addItem(ipSection, "IP Error", "Could not fetch IP");
});

const fingerprintSection = addSection("🧠 Fingerprint");

const fingerprint = `
${navigator.userAgent}
${screen.width}
${screen.height}
${navigator.language}
${Intl.DateTimeFormat().resolvedOptions().timeZone}
${navigator.hardwareConcurrency}
${navigator.deviceMemory}
`;

const hash = btoa(fingerprint).substring(0, 50);

addItem(fingerprintSection, "Fingerprint Hash", hash);

</script>

</body>
</html>
