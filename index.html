<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>🚀 faysk.dev</title>

<style>

:root{
  --bg:#050505;
  --card:#0f0f0f;
  --border:#1d1d1d;

  --primary:#00ff88;
  --primary-soft:#00ffaa;

  --text:#ffffff;
  --muted:#7d7d7d;

  --danger:#ff4d4d;
  --warning:#ffb020;
  --info:#00d9ff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;

  background:
    radial-gradient(circle at top left, rgba(0,255,136,.08), transparent 25%),
    radial-gradient(circle at bottom right, rgba(0,217,255,.05), transparent 25%);

  z-index:-1;
}

.container{
  width:100%;
  max-width:1800px;
  margin:auto;
  padding:20px;
}

.hero{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;

  padding:25px;

  border:1px solid var(--border);
  background:rgba(15,15,15,.85);

  border-radius:24px;

  backdrop-filter:blur(10px);

  margin-bottom:25px;

  box-shadow:
    0 0 40px rgba(0,255,136,.05);
}

.hero-left h1{
  font-size:clamp(2rem,5vw,4rem);
  margin-bottom:10px;
}

.hero-left p{
  color:var(--muted);
}

.stats{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

.stat{
  background:#101010;
  border:1px solid #222;

  min-width:130px;

  padding:16px;
  border-radius:18px;
}

.stat-title{
  color:var(--muted);
  font-size:.75rem;
  margin-bottom:8px;
}

.stat-value{
  color:var(--primary);
  font-size:1rem;
  font-weight:bold;
}

.layout{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:20px;
}

.sidebar{
  position:sticky;
  top:20px;

  height:max-content;

  background:rgba(15,15,15,.85);

  border:1px solid var(--border);
  border-radius:22px;

  padding:20px;
}

.sidebar h3{
  margin-bottom:20px;
  color:var(--primary-soft);
}

.sidebar nav{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.sidebar a{
  text-decoration:none;
  color:#aaa;

  background:#101010;

  border:1px solid #1e1e1e;

  padding:12px 14px;

  border-radius:12px;

  transition:.2s;
}

.sidebar a:hover{
  color:white;
  border-color:#333;
  transform:translateX(4px);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
  gap:20px;
}

.section{
  background:rgba(15,15,15,.9);

  border:1px solid var(--border);

  border-radius:22px;

  overflow:hidden;

  box-shadow:
    0 0 20px rgba(0,255,136,.03);

  transition:.2s;
}

.section:hover{
  transform:translateY(-4px);
}

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:18px;

  background:#111;

  border-bottom:1px solid var(--border);
}

.section-header h2{
  font-size:1rem;
  color:var(--primary-soft);
}

.section-body{
  padding:18px;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:15px;

  padding:12px 0;

  border-bottom:1px solid rgba(255,255,255,.04);
}

.item:last-child{
  border-bottom:none;
}

.label{
  color:var(--muted);
  min-width:140px;
  font-size:.92rem;
}

.value{
  text-align:right;
  color:var(--primary);

  word-break:break-word;

  font-size:.92rem;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;

  background:#101010;

  border:1px solid #222;

  border-radius:999px;

  padding:8px 14px;

  color:var(--primary);

  font-size:.75rem;
}

.dot{
  width:10px;
  height:10px;

  border-radius:50%;

  background:var(--primary);

  box-shadow:
    0 0 10px var(--primary);
}

.footer{
  margin-top:40px;
  text-align:center;
  color:#666;
  font-size:.85rem;
}

.progress{
  width:100%;
  height:8px;

  background:#111;

  border-radius:999px;

  overflow:hidden;

  margin-top:8px;
}

.progress-bar{
  height:100%;
  background:linear-gradient(90deg,var(--primary),var(--info));
  width:0%;
}

.status-good{
  color:var(--primary);
}

.status-warning{
  color:var(--warning);
}

.status-danger{
  color:var(--danger);
}

@media(max-width:1200px){

  .layout{
    grid-template-columns:1fr;
  }

  .sidebar{
    position:relative;
    top:0;
  }

}

@media(max-width:768px){

  .hero{
    flex-direction:column;
    align-items:flex-start;
  }

  .item{
    flex-direction:column;
  }

  .value{
    text-align:left;
  }

}

</style>
</head>

<body>

<div class="container">

  <div class="hero">

    <div class="hero-left">
      <h1>🚀 faysk.dev</h1>
      <p>Advanced Browser Intelligence & Telemetry Interface</p>
    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-title">STATUS</div>
        <div class="stat-value">ONLINE</div>
      </div>

      <div class="stat">
        <div class="stat-title">TIMEZONE</div>
        <div class="stat-value" id="timezoneTop">...</div>
      </div>

      <div class="stat">
        <div class="stat-title">LANGUAGE</div>
        <div class="stat-value" id="languageTop">...</div>
      </div>

      <div class="stat">
        <div class="stat-title">PRIVACY SCORE</div>
        <div class="stat-value">74%</div>
        <div class="progress">
          <div class="progress-bar" style="width:74%"></div>
        </div>
      </div>

      <div class="stat">
        <div class="stat-title">ENTROPY</div>
        <div class="stat-value">HIGH</div>
      </div>

    </div>

  </div>

  <div class="layout">

    <aside class="sidebar">

      <h3>🧭 Navigation</h3>

      <nav id="sidebarNav"></nav>

    </aside>

    <main>

      <div class="grid" id="content"></div>

    </main>

  </div>

  <div class="footer">
    faysk.dev • telemetry interface • cyberpunk edition 😎
  </div>

</div>

<script>

const content =
document.getElementById("content");

const sidebarNav =
document.getElementById("sidebarNav");

document.getElementById("timezoneTop").innerText =
Intl.DateTimeFormat().resolvedOptions().timeZone;

document.getElementById("languageTop").innerText =
navigator.language;


// =======================================
// HELPERS
// =======================================

function createSection(id,title){

  const section =
  document.createElement("div");

  section.className = "section";
  section.id = id;

  section.innerHTML = `
    <div class="section-header">
      <h2>${title}</h2>

      <div class="badge">
        <div class="dot"></div>
        ACTIVE
      </div>
    </div>

    <div class="section-body"></div>
  `;

  content.appendChild(section);

  const link =
  document.createElement("a");

  link.href = `#${id}`;
  link.innerText = title;

  sidebarNav.appendChild(link);

  return section.querySelector(".section-body");
}

function addItem(section,label,value){

  const item =
  document.createElement("div");

  item.className = "item";

  item.innerHTML = `
    <div class="label">${label}</div>
    <div class="value">${value}</div>
  `;

  section.appendChild(item);
}


// =======================================
// BROWSER
// =======================================

const browser =
createSection("browser","🌐 Browser");

addItem(browser,"User Agent",navigator.userAgent);
addItem(browser,"Platform",navigator.platform);
addItem(browser,"Vendor",navigator.vendor);
addItem(browser,"Language",navigator.language);
addItem(browser,"Languages",navigator.languages.join(", "));
addItem(browser,"Cookies Enabled",navigator.cookieEnabled);
addItem(browser,"Online",navigator.onLine);
addItem(browser,"Java Enabled",navigator.javaEnabled());
addItem(browser,"Do Not Track",navigator.doNotTrack);
addItem(browser,"Webdriver",navigator.webdriver || false);
addItem(browser,"PDF Viewer",navigator.pdfViewerEnabled);
addItem(browser,"Hardware Threads",navigator.hardwareConcurrency || "Unknown");
addItem(browser,"Estimated RAM",navigator.deviceMemory ? navigator.deviceMemory+" GB":"Unknown");
addItem(browser,"Max Touch Points",navigator.maxTouchPoints);


// =======================================
// SCREEN
// =======================================

const screenInfo =
createSection("screen","🖥️ Screen");

addItem(screenInfo,"Resolution",`${screen.width} x ${screen.height}`);
addItem(screenInfo,"Available Area",`${screen.availWidth} x ${screen.availHeight}`);
addItem(screenInfo,"Color Depth",screen.colorDepth);
addItem(screenInfo,"Pixel Ratio",window.devicePixelRatio);
addItem(screenInfo,"Orientation",screen.orientation?.type || "Unknown");
addItem(screenInfo,"Dark Mode",
window.matchMedia('(prefers-color-scheme: dark)').matches);


// =======================================
// NETWORK
// =======================================

const network =
createSection("network","📡 Network");

if(navigator.connection){

  addItem(network,"Connection Type",navigator.connection.effectiveType);
  addItem(network,"Downlink",navigator.connection.downlink+" Mbps");
  addItem(network,"RTT",navigator.connection.rtt+" ms");
  addItem(network,"Save Data",navigator.connection.saveData);

}

addItem(network,"IPv6","Detecting...");
addItem(network,"VPN Detection","Future Backend");
addItem(network,"TOR Detection","Future Backend");
addItem(network,"Proxy Detection","Future Backend");
addItem(network,"ASN","Future Backend");
addItem(network,"ISP","Future Backend");
addItem(network,"Reverse DNS","Future Backend");


// =======================================
// GPU
// =======================================

const gpu =
createSection("gpu","🎮 GPU");

try{

  const canvas =
  document.createElement("canvas");

  const gl =
  canvas.getContext("webgl") ||
  canvas.getContext("experimental-webgl");

  if(gl){

    const debugInfo =
    gl.getExtension("WEBGL_debug_renderer_info");

    if(debugInfo){

      addItem(
        gpu,
        "GPU Vendor",
        gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL)
      );

      addItem(
        gpu,
        "GPU Renderer",
        gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL)
      );

    }

    addItem(gpu,"WebGL Version",
      gl.getParameter(gl.VERSION));

    addItem(gpu,"GLSL Version",
      gl.getParameter(gl.SHADING_LANGUAGE_VERSION));

    addItem(gpu,"Max Texture Size",
      gl.getParameter(gl.MAX_TEXTURE_SIZE));

  }

}catch(e){

  addItem(gpu,"GPU Error",e.message);

}

addItem(gpu,"WebGPU","Future Detection");
addItem(gpu,"VRAM","Future Detection");
addItem(gpu,"Refresh Rate","Estimated Future");


// =======================================
// LOCATION
// =======================================

const locationInfo =
createSection("location","📍 Geolocation");

addItem(locationInfo,"Status","Waiting permission...");

navigator.geolocation.getCurrentPosition(

(position)=>{

  locationInfo.innerHTML = "";

  addItem(locationInfo,"Latitude",
    position.coords.latitude);

  addItem(locationInfo,"Longitude",
    position.coords.longitude);

  addItem(locationInfo,"Accuracy",
    position.coords.accuracy+"m");

},

(error)=>{

  locationInfo.innerHTML = "";

  addItem(locationInfo,"Location Error",
    error.message);

}

);

addItem(locationInfo,"Country","Future Backend");
addItem(locationInfo,"City","Future Backend");
addItem(locationInfo,"Region","Future Backend");
addItem(locationInfo,"Threat Level","Future Backend");


// =======================================
// BATTERY
// =======================================

const battery =
createSection("battery","🔋 Battery");

if(navigator.getBattery){

  navigator.getBattery().then((b)=>{

    addItem(battery,"Charging",b.charging);
    addItem(battery,"Battery Level",
      Math.round(b.level*100)+"%");

  });

}else{

  addItem(battery,"Battery API","Not Supported");

}


// =======================================
// STORAGE
// =======================================

const storage =
createSection("storage","💾 Storage");

addItem(storage,"localStorage",
  typeof localStorage !== "undefined");

addItem(storage,"sessionStorage",
  typeof sessionStorage !== "undefined");

addItem(storage,"IndexedDB",
  "indexedDB" in window);

addItem(storage,"Cache API",
  "caches" in window);

addItem(storage,"Service Worker",
  "serviceWorker" in navigator);

addItem(storage,"Clipboard API",
  "clipboard" in navigator);


// =======================================
// MEDIA
// =======================================

const media =
createSection("media","🎤 Media Devices");

if(navigator.mediaDevices){

  navigator.mediaDevices.enumerateDevices()
  .then(devices=>{

    const audioInputs =
      devices.filter(d=>d.kind==="audioinput").length;

    const audioOutputs =
      devices.filter(d=>d.kind==="audiooutput").length;

    const videoInputs =
      devices.filter(d=>d.kind==="videoinput").length;

    addItem(media,"Microphones",audioInputs);
    addItem(media,"Speakers",audioOutputs);
    addItem(media,"Cameras",videoInputs);

  });

}

addItem(media,"AV1","Future Detection");
addItem(media,"VP9","Future Detection");
addItem(media,"H265","Future Detection");
addItem(media,"HDR Playback","Future Detection");


// =======================================
// PERFORMANCE
// =======================================

const performanceInfo =
createSection("performance","⚡ Performance");

addItem(
  performanceInfo,
  "Page Load",
  performance.now().toFixed(2)+" ms"
);

addItem(
  performanceInfo,
  "CPU Benchmark",
  "Future Benchmark"
);

addItem(
  performanceInfo,
  "GPU Benchmark",
  "Future Benchmark"
);

addItem(
  performanceInfo,
  "FPS Monitor",
  "Future Benchmark"
);


// =======================================
// SECURITY
// =======================================

const security =
createSection("security","🔐 Security");

addItem(security,"Secure Context",
  window.isSecureContext);

addItem(security,"HTTPS",
  location.protocol === "https:");

addItem(security,"Cross Origin Isolated",
  window.crossOriginIsolated);

addItem(security,"AdBlock Detection",
  "Scanning...");

addItem(security,"Incognito Detection",
  "Future Detection");

addItem(security,"Brave Detection",
  navigator.brave ? true : false);

addItem(security,"Privacy Resistance",
  "Future Detection");


// =======================================
// FINGERPRINT
// =======================================

const fingerprint =
createSection("fingerprint","🧠 Fingerprinting");

const rawFingerprint = `
${navigator.userAgent}
${screen.width}
${screen.height}
${navigator.language}
${navigator.hardwareConcurrency}
${navigator.deviceMemory}
`;

const hash =
btoa(rawFingerprint).substring(0,60);

addItem(fingerprint,"Basic Fingerprint",hash);
addItem(fingerprint,"Canvas Fingerprint","Generating...");
addItem(fingerprint,"Audio Fingerprint","Future Detection");
addItem(fingerprint,"Font Fingerprint","Future Detection");
addItem(fingerprint,"TLS Fingerprint","Backend Required");
addItem(fingerprint,"JA3 Hash","Backend Required");
addItem(fingerprint,"Uniqueness Score","Estimated Future");


// =======================================
// APIs
// =======================================

const apis =
createSection("apis","🧩 Browser APIs");

addItem(apis,"Bluetooth API",
  "bluetooth" in navigator);

addItem(apis,"USB API",
  "usb" in navigator);

addItem(apis,"Serial API",
  "serial" in navigator);

addItem(apis,"NFC API",
  "NDEFReader" in window);

addItem(apis,"Vibration API",
  "vibrate" in navigator);

addItem(apis,"Share API",
  "share" in navigator);

addItem(apis,"Wake Lock API",
  "wakeLock" in navigator);

addItem(apis,"EyeDropper API",
  "EyeDropper" in window);


// =======================================
// BEHAVIOR
// =======================================

const behavior =
createSection("behavior","🧬 Behavioral");

addItem(behavior,"Mouse Tracking","Active");
addItem(behavior,"Scroll Tracking","Active");
addItem(behavior,"Keyboard Analysis","Future");
addItem(behavior,"Idle Detection","Future");
addItem(behavior,"Rage Click Detection","Future");
addItem(behavior,"Human Score","Future");


// =======================================
// SENSORS
// =======================================

const sensors =
createSection("sensors","📱 Sensors");

addItem(sensors,"Accelerometer",
  "DeviceMotionEvent" in window);

addItem(sensors,"Gyroscope",
  "DeviceOrientationEvent" in window);

addItem(sensors,"Ambient Light",
  "AmbientLightSensor" in window);

addItem(sensors,"Magnetometer",
  "Magnetometer" in window);

addItem(sensors,"Gravity Sensor",
  "GravitySensor" in window);


// =======================================
// WEBRTC
// =======================================

const webrtc =
createSection("webrtc","🌐 WebRTC");

addItem(webrtc,"RTCPeerConnection",
  !!window.RTCPeerConnection);

addItem(webrtc,"MediaRecorder",
  !!window.MediaRecorder);

addItem(webrtc,"WebSocket",
  !!window.WebSocket);

addItem(webrtc,"Local IP Leak",
  "Future Detection");


// =======================================
// IP
// =======================================

const ip =
createSection("ip","🌍 Public IP");

fetch("https://api.ipify.org?format=json")
.then(res=>res.json())
.then(data=>{

  addItem(ip,"IP Address",data.ip);

})
.catch(()=>{

  addItem(ip,"IP Error","Could not fetch IP");

});


// =======================================
// SPEECH
// =======================================

const speech =
createSection("speech","🗣️ Speech");

if("speechSynthesis" in window){

  const voices =
    speechSynthesis.getVoices();

  addItem(speech,"Speech Synthesis",true);
  addItem(speech,"Installed Voices",voices.length);

}else{

  addItem(speech,"Speech Synthesis",false);

}


// =======================================
// PLUGINS
// =======================================

const plugins =
createSection("plugins","🧩 Plugins");

addItem(plugins,"Installed Plugins",
  navigator.plugins.length);

addItem(plugins,"MIME Types",
  navigator.mimeTypes.length);


// =======================================
// CANVAS FP
// =======================================

try{

  const canvas =
    document.createElement("canvas");

  const ctx =
    canvas.getContext("2d");

  ctx.font = "16px Arial";
  ctx.fillStyle = "#00ff88";
  ctx.fillText("faysk.dev",10,20);

  const data =
    canvas.toDataURL();

  const canvasHash =
    btoa(data).substring(0,60);

  addItem(
    fingerprint,
    "Canvas Hash",
    canvasHash
  );

}catch(e){

  addItem(fingerprint,"Canvas Error",e.message);

}


// =======================================
// CLOCK
// =======================================

setInterval(()=>{

  const time =
    new Date().toLocaleTimeString();

  document.title =
    `🚀 ${time} • faysk.dev`;

},1000);

</script>

</body>
</html>
