<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>faysk.dev | System Scanner</title>

<style>

:root{
  --bg:#050505;
  --card:#0f0f0f;
  --border:#1f1f1f;
  --primary:#00ff88;
  --primary-soft:#00ffaa;
  --text:#ffffff;
  --muted:#7d7d7d;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter, Arial, sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at top left, rgba(0,255,136,.08), transparent 25%),
    radial-gradient(circle at bottom right, rgba(0,255,255,.06), transparent 25%);
  z-index:-1;
}

.container{
  width:100%;
  max-width:1400px;
  margin:auto;
  padding:20px;
}

.hero{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:20px;

  margin-bottom:30px;
  padding:25px;

  border:1px solid var(--border);
  background:rgba(15,15,15,.85);
  backdrop-filter:blur(10px);

  border-radius:20px;

  box-shadow:
    0 0 30px rgba(0,255,136,.05);
}

.hero-left h1{
  font-size:clamp(2rem,5vw,4rem);
  margin-bottom:10px;
}

.hero-left p{
  color:var(--muted);
}

.status{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

.status-box{
  background:#101010;
  border:1px solid #222;
  padding:15px;
  border-radius:14px;
  min-width:120px;
}

.status-box .title{
  font-size:.8rem;
  color:var(--muted);
  margin-bottom:6px;
}

.status-box .value{
  color:var(--primary);
  font-weight:bold;
  font-size:1rem;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:20px;
}

.section{
  background:rgba(15,15,15,.9);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;

  box-shadow:
    0 0 20px rgba(0,255,136,.03);

  transition:.25s;
}

.section:hover{
  transform:translateY(-3px);
  border-color:#2b2b2b;
}

.section-header{
  padding:18px;
  border-bottom:1px solid var(--border);

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:#111;
}

.section-header h2{
  font-size:1rem;
  color:var(--primary-soft);
}

.section-body{
  padding:18px;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:15px;

  padding:12px 0;

  border-bottom:1px solid rgba(255,255,255,.04);
}

.item:last-child{
  border-bottom:none;
}

.label{
  color:var(--muted);
  font-size:.92rem;
  min-width:120px;
}

.value{
  color:var(--primary);
  text-align:right;
  word-break:break-word;
  font-size:.92rem;
}

.footer{
  margin-top:40px;
  text-align:center;
  color:#666;
  font-size:.85rem;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;

  background:#111;
  border:1px solid #222;

  padding:8px 14px;
  border-radius:999px;

  color:var(--primary);
  font-size:.85rem;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--primary);

  box-shadow:
    0 0 10px var(--primary);
}

.loading{
  color:orange;
}

.error{
  color:red;
}

@media(max-width:768px){

  .hero{
    flex-direction:column;
    align-items:flex-start;
  }

  .item{
    flex-direction:column;
  }

  .value{
    text-align:left;
  }

}

</style>
</head>

<body>

<div class="container">

  <div class="hero">

    <div class="hero-left">
      <h1>🚀 faysk.dev</h1>
      <p>Advanced Browser & System Scanner</p>
    </div>

    <div class="status">

      <div class="status-box">
        <div class="title">STATUS</div>
        <div class="value">ONLINE</div>
      </div>

      <div class="status-box">
        <div class="title">TIMEZONE</div>
        <div class="value" id="timezone-top">...</div>
      </div>

      <div class="status-box">
        <div class="title">LANGUAGE</div>
        <div class="value" id="language-top">...</div>
      </div>

    </div>

  </div>

  <div class="grid" id="content"></div>

  <div class="footer">
    faysk.dev • telemetry interface • cyberpunk edition 😎
  </div>

</div>

<script>

const content = document.getElementById("content");

function createSection(title){

  const section = document.createElement("div");
  section.className = "section";

  section.innerHTML = `
    <div class="section-header">
      <h2>${title}</h2>
      <div class="badge">
        <div class="dot"></div>
        ACTIVE
      </div>
    </div>

    <div class="section-body"></div>
  `;

  content.appendChild(section);

  return section.querySelector(".section-body");
}

function addItem(section,label,value){

  const item = document.createElement("div");

  item.className = "item";

  item.innerHTML = `
    <div class="label">${label}</div>
    <div class="value">${value}</div>
  `;

  section.appendChild(item);
}

document.getElementById("timezone-top").innerText =
Intl.DateTimeFormat().resolvedOptions().timeZone;

document.getElementById("language-top").innerText =
navigator.language;

const browser = createSection("🌐 Browser Information");

addItem(browser,"User Agent",navigator.userAgent);
addItem(browser,"Platform",navigator.platform);
addItem(browser,"Language",navigator.language);
addItem(browser,"Languages",navigator.languages.join(", "));
addItem(browser,"Cookies Enabled",navigator.cookieEnabled);
addItem(browser,"Online",navigator.onLine);
addItem(browser,"CPU Threads",navigator.hardwareConcurrency || "Unknown");
addItem(browser,"RAM",navigator.deviceMemory ? navigator.deviceMemory + " GB" : "Unknown");
addItem(browser,"Touch Points",navigator.maxTouchPoints);

const screenInfo = createSection("🖥️ Screen Information");

addItem(screenInfo,"Resolution",`${screen.width} x ${screen.height}`);
addItem(screenInfo,"Available Area",`${screen.availWidth} x ${screen.availHeight}`);
addItem(screenInfo,"Color Depth",screen.colorDepth);
addItem(screenInfo,"Pixel Ratio",window.devicePixelRatio);

const timeInfo = createSection("🕒 Time Information");

addItem(timeInfo,"Timezone",Intl.DateTimeFormat().resolvedOptions().timeZone);
addItem(timeInfo,"Current Time",new Date().toString());

const network = createSection("📡 Network");

if(navigator.connection){

  addItem(network,"Connection Type",navigator.connection.effectiveType);
  addItem(network,"Downlink",navigator.connection.downlink + " Mbps");
  addItem(network,"RTT",navigator.connection.rtt + " ms");
  addItem(network,"Save Data",navigator.connection.saveData);

}else{

  addItem(network,"Network API","Not Supported");

}

const gpu = createSection("🎮 GPU Information");

try{

  const canvas = document.createElement("canvas");

  const gl =
    canvas.getContext("webgl") ||
    canvas.getContext("experimental-webgl");

  if(gl){

    const debugInfo =
      gl.getExtension("WEBGL_debug_renderer_info");

    if(debugInfo){

      addItem(
        gpu,
        "GPU Vendor",
        gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL)
      );

      addItem(
        gpu,
        "GPU Renderer",
        gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL)
      );

    }

  }

}catch(e){

  addItem(gpu,"GPU Error",e.message);

}

const locationInfo = createSection("📍 Geolocation");

addItem(locationInfo,"Location Status","Waiting permission...");

navigator.geolocation.getCurrentPosition(

(position)=>{

  locationInfo.innerHTML = "";

  addItem(locationInfo,"Latitude",position.coords.latitude);
  addItem(locationInfo,"Longitude",position.coords.longitude);
  addItem(locationInfo,"Accuracy",position.coords.accuracy + "m");

},

(error)=>{

  locationInfo.innerHTML = "";

  addItem(locationInfo,"Location Error",error.message);

}

);

const battery = createSection("🔋 Battery");

if(navigator.getBattery){

  navigator.getBattery().then((b)=>{

    addItem(battery,"Charging",b.charging);
    addItem(battery,"Battery Level",Math.round(b.level*100)+"%");

  });

}else{

  addItem(battery,"Battery API","Not Supported");

}

const ip = createSection("🌍 Public IP");

fetch("https://api.ipify.org?format=json")
.then(res=>res.json())
.then(data=>{

  addItem(ip,"IP Address",data.ip);

})
.catch(()=>{

  addItem(ip,"IP Error","Could not fetch IP");

});

const fingerprint = createSection("🧠 Fingerprint");

const rawFingerprint = `
${navigator.userAgent}
${screen.width}
${screen.height}
${navigator.language}
${Intl.DateTimeFormat().resolvedOptions().timeZone}
${navigator.hardwareConcurrency}
${navigator.deviceMemory}
`;

const hash =
btoa(rawFingerprint).substring(0,50);

addItem(fingerprint,"Fingerprint Hash",hash);

// ===============================
// EXTRA SYSTEM INFORMATION
// ===============================

const advanced = createSection("🧬 Advanced Capabilities");

addItem(advanced,"Browser Vendor",navigator.vendor);
addItem(advanced,"Browser CodeName",navigator.appCodeName);
addItem(advanced,"Browser Name",navigator.appName);
addItem(advanced,"Browser Version",navigator.appVersion);
addItem(advanced,"Product",navigator.product);
addItem(advanced,"Product Sub",navigator.productSub);
addItem(advanced,"PDF Viewer Enabled",navigator.pdfViewerEnabled);
addItem(advanced,"Do Not Track",navigator.doNotTrack);
addItem(advanced,"Java Enabled",navigator.javaEnabled());
addItem(advanced,"Webdriver (Bot)",navigator.webdriver || false);
addItem(advanced,"Dark Mode",window.matchMedia('(prefers-color-scheme: dark)').matches);
addItem(advanced,"Reduced Motion",window.matchMedia('(prefers-reduced-motion: reduce)').matches);
addItem(advanced,"Standalone App",window.matchMedia('(display-mode: standalone)').matches);


// ===============================
// STORAGE
// ===============================

const storage = createSection("💾 Storage & Browser Features");

addItem(storage,"localStorage",typeof localStorage !== "undefined");
addItem(storage,"sessionStorage",typeof sessionStorage !== "undefined");
addItem(storage,"IndexedDB","indexedDB" in window);
addItem(storage,"Cache API","caches" in window);
addItem(storage,"Service Worker","serviceWorker" in navigator);
addItem(storage,"Clipboard API","clipboard" in navigator);
addItem(storage,"Share API","share" in navigator);
addItem(storage,"Vibration API","vibrate" in navigator);


// ===============================
// DEVICE FEATURES
// ===============================

const device = createSection("📱 Device Features");

addItem(device,"Mobile Device",/Mobi|Android/i.test(navigator.userAgent));
addItem(device,"Touch Device",'ontouchstart' in window);
addItem(device,"Portrait Mode",window.innerHeight > window.innerWidth);
addItem(device,"Screen Orientation",screen.orientation?.type || "Unknown");
addItem(device,"Fullscreen Enabled",document.fullscreenEnabled);
addItem(device,"Device Pixel Ratio",window.devicePixelRatio);


// ===============================
// MEDIA DEVICES
// ===============================

const media = createSection("🎤 Media Devices");

if(navigator.mediaDevices){

  navigator.mediaDevices.enumerateDevices()
  .then(devices => {

    const audioInputs =
      devices.filter(d => d.kind === "audioinput").length;

    const audioOutputs =
      devices.filter(d => d.kind === "audiooutput").length;

    const videoInputs =
      devices.filter(d => d.kind === "videoinput").length;

    addItem(media,"Microphones",audioInputs);
    addItem(media,"Speakers",audioOutputs);
    addItem(media,"Cameras",videoInputs);

  });

}else{

  addItem(media,"Media Devices","Not Supported");

}


// ===============================
// SPEECH SYNTHESIS
// ===============================

const speech = createSection("🗣️ Speech & Voice");

if("speechSynthesis" in window){

  const voices =
    speechSynthesis.getVoices();

  addItem(speech,"Speech Synthesis",true);
  addItem(speech,"Installed Voices",voices.length);

}else{

  addItem(speech,"Speech Synthesis",false);

}


// ===============================
// PLUGINS
// ===============================

const plugins = createSection("🧩 Plugins & MIME Types");

addItem(plugins,"Installed Plugins",navigator.plugins.length);
addItem(plugins,"MIME Types",navigator.mimeTypes.length);


// ===============================
// WEBRTC
// ===============================

const webrtc = createSection("🌐 WebRTC");

addItem(webrtc,"RTCPeerConnection",
  !!window.RTCPeerConnection);

addItem(webrtc,"MediaRecorder",
  !!window.MediaRecorder);

addItem(webrtc,"WebSocket",
  !!window.WebSocket);


// ===============================
// BATTERY LIVE UPDATE
// ===============================

if(navigator.getBattery){

  navigator.getBattery().then((battery)=>{

    battery.addEventListener("levelchange",()=>{

      console.log("Battery changed");

    });

  });

}


// ===============================
// PAGE PERFORMANCE
// ===============================

const performanceSection =
createSection("⚡ Performance");

addItem(
  performanceSection,
  "Page Load Time",
  performance.now().toFixed(2) + " ms"
);

addItem(
  performanceSection,
  "CPU Cores",
  navigator.hardwareConcurrency || "Unknown"
);

addItem(
  performanceSection,
  "Estimated RAM",
  navigator.deviceMemory
    ? navigator.deviceMemory + " GB"
    : "Unknown"
);


// ===============================
// CANVAS FINGERPRINT
// ===============================

const canvasFp =
createSection("🎨 Canvas Fingerprint");

try{

  const canvas =
    document.createElement("canvas");

  const ctx =
    canvas.getContext("2d");

  ctx.textBaseline = "top";
  ctx.font = "16px Arial";
  ctx.fillStyle = "#00ff88";
  ctx.fillText("faysk.dev",10,10);

  const data =
    canvas.toDataURL();

  addItem(
    canvasFp,
    "Canvas Hash",
    btoa(data).substring(0,60)
  );

}catch(e){

  addItem(canvasFp,"Canvas Error",e.message);

}


// ===============================
// AD BLOCK DETECTION
// ===============================

const adblock =
createSection("🚫 AdBlock Detection");

const bait =
document.createElement("div");

bait.className =
"adsbox";

document.body.appendChild(bait);

setTimeout(()=>{

  if(
    bait.offsetHeight === 0
  ){

    addItem(adblock,"AdBlock Enabled",true);

  }else{

    addItem(adblock,"AdBlock Enabled",false);

  }

  bait.remove();

},100);

// ===============================
// LIVE CLOCK
// ===============================

setInterval(()=>{

  const time =
    new Date().toLocaleTimeString();

  document.title =
    `🚀 ${time} • faysk.dev`;

},1000);

</script>

</body>
</html>
